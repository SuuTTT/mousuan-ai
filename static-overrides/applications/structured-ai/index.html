<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>结构化 AI · Structured AI</title>
  <meta name="description" content="结构化 AI：从编码树到大模型、知识编辑与智能体。" />
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/assets/index-DgX9Nooi.css" />
  <style>
    .principle-nav button{min-width:42px;padding:10px 0;border:1px solid rgba(255,255,255,.35);border-radius:999px}
    .principle-nav button:hover{border-color:#65f0ff;color:#65f0ff}
    .principle-sources b{font-family:"Helvetica Neue",Arial,sans-serif;font-variant-emoji:text}
  </style>
</head>
<body>
  <main class="principle-page">
    <header class="principle-nav">
      <a class="brand" href="/"><span>SI</span><b>STRUCTURAL<br />INTELLIGENCE</b></a>
      <a class="principle-back" id="back" href="/">←︎ 返回研究主页</a>
      <button id="language-toggle" type="button" aria-label="Switch language">EN</button>
    </header>
    <section class="principle-hero">
      <div class="principle-hero-inner">
        <p class="overline" id="eyebrow"></p>
        <h1 id="title"></h1>
        <p id="lead"></p>
      </div>
    </section>
    <section class="principle-body shell">
      <div class="principle-sections" id="sections"></div>
      <aside class="principle-sources" id="sources"></aside>
      <p class="principle-closing" id="closing"></p>
    </section>
  </main>
  <script>
    const copy = {
      zh: {
        back: "←︎ 返回研究主页",
        toggle: "EN",
        eyebrow: "应用成果 · 04 / 结构化 AI",
        title: ["结构化 AI", "让大模型与智能体可理解"],
        lead: "从编码树到大模型与智能体，把知识编辑、推理和行动放进可解释的结构信息框架。",
        sections: [
          ["结构化知识", "模型不应只保存分散的事实。结构化 AI 关注知识之间的层级、关系和组织方式，使知识可以被定位、编辑与验证。"],
          ["推理与行动", "可解释推理需要展示信息如何被解码、哪些结构关系支持结论，以及结论如何转化为行动。"],
          ["从模型到智能体", "大模型提供广泛的语言与知识能力，结构信息为其补充可组织、可控制、可验证的内部结构，推动智能体走向自主与可信。"]
        ],
        sourcesLabel: "代表作与研究入口",
        sources: [
          ["结构熵引导的知识缺陷检测与修复智能体（SENATOR）", "https://arxiv.org/abs/2505.07184"],
          ["SetKE：面向知识元素重叠的知识编辑（IJCAI 2025）", "https://arxiv.org/abs/2504.20972"],
          ["大模型知识定位：实体与关系视角差异（CIKM 2024）", "https://arxiv.org/abs/2409.00617"],
          ["结构熵综述仓库", "https://github.com/SuuTTT/structural-entropy-survey"]
        ],
        closing: "本页是结构化 AI 的研究方向说明；代码与论文链接会随着项目成果继续补充。"
      },
      en: {
        back: "←︎ Back to research hub",
        toggle: "中",
        eyebrow: "OUTCOMES · 04 / STRUCTURED AI",
        title: ["Structured AI", "when models and agents become legible"],
        lead: "From encoding trees to foundation models and agents, structured AI places knowledge editing, reasoning, and action inside an interpretable structural-information framework.",
        sections: [
          ["Structured knowledge", "A model should not only store disconnected facts. Structured AI studies hierarchy, relations, and organisation so knowledge can be located, edited, and verified."],
          ["Reasoning and action", "Explainable reasoning shows how information was decoded, which structural relations support a conclusion, and how that conclusion becomes an action."],
          ["From models to agents", "Foundation models bring broad language and knowledge capabilities. Structural information adds organisation, control, and verification so agents can become more autonomous and trustworthy."]
        ],
        sourcesLabel: "REPRESENTATIVE WORKS",
        sources: [
          ["Structural Entropy Guided Agent for Detecting and Repairing Knowledge Deficiencies in LLMs", "https://arxiv.org/abs/2505.07184"],
          ["SetKE: Knowledge Editing for Knowledge Elements Overlap · IJCAI 2025", "https://arxiv.org/abs/2504.20972"],
          ["Does Knowledge Localization Hold True? · CIKM 2024", "https://arxiv.org/abs/2409.00617"],
          ["Structural Entropy survey repository", "https://github.com/SuuTTT/structural-entropy-survey"]
        ],
        closing: "This page describes the structured-AI direction; project papers and code links will grow with new outcomes."
      }
    };

    const elements = {
      back: document.getElementById("back"),
      toggle: document.getElementById("language-toggle"),
      eyebrow: document.getElementById("eyebrow"),
      title: document.getElementById("title"),
      lead: document.getElementById("lead"),
      sections: document.getElementById("sections"),
      sources: document.getElementById("sources"),
      closing: document.getElementById("closing")
    };

    let language = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh";

    function render() {
      const c = copy[language];
      document.documentElement.lang = language === "en" ? "en" : "zh-CN";
      elements.back.textContent = c.back;
      elements.toggle.textContent = c.toggle;
      elements.eyebrow.textContent = c.eyebrow;
      elements.title.replaceChildren(...c.title.map(line => {
        const span = document.createElement("span");
        span.textContent = line;
        return span;
      }));
      elements.lead.textContent = c.lead;
      elements.sections.replaceChildren(...c.sections.map(([heading, text], index) => {
        const article = document.createElement("article");
        const number = document.createElement("span");
        number.textContent = `0${index + 1}`;
        const content = document.createElement("div");
        const h2 = document.createElement("h2");
        h2.textContent = heading;
        const p = document.createElement("p");
        p.textContent = text;
        content.append(h2, p);
        article.append(number, content);
        return article;
      }));
      const label = document.createElement("p");
      label.className = "overline";
      label.textContent = c.sourcesLabel;
      elements.sources.replaceChildren(label, ...c.sources.map(([title, href]) => {
        const a = document.createElement("a");
        a.href = href;
        a.target = "_blank";
        a.rel = "noreferrer";
        a.append(document.createTextNode(title));
        const arrow = document.createElement("b");
        arrow.textContent = "↗︎";
        a.append(arrow);
        return a;
      }));
      elements.closing.textContent = c.closing;
    }

    elements.toggle.addEventListener("click", () => {
      language = language === "zh" ? "en" : "zh";
      const url = new URL(location.href);
      if (language === "en") url.searchParams.set("lang", "en");
      else url.searchParams.delete("lang");
      history.replaceState(null, "", url);
      render();
    });

    render();
  </script>
</body>
</html>
