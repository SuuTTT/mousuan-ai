  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090b16;color:#f5f7ff;font-family:Arial,"PingFang SC","Noto Sans SC",sans-serif}.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:27px 18px;background:linear-gradient(160deg,#151936,#080911);border-right:1px solid #31385d}.brand{font-weight:800;font-size:18px}.brand b{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:10px;border:1px solid #b9c4ee;font-size:12px}.side p{color:#a7b0d0;font-size:13px;line-height:1.65}.side input{width:100%;padding:11px;border:1px solid #3c4775;background:#0b0e20;color:white;border-radius:4px}.list{display:grid;gap:4px;margin-top:18px}.list button{display:grid;grid-template-columns:31px 1fr 7px;gap:7px;align-items:center;width:100%;padding:10px 7px;border:0;border-left:2px solid transparent;background:transparent;color:#c1c8e2;text-align:left;cursor:pointer}.list button:hover,.list button.on{border-left-color:#64efff;background:#202750;color:#fff}.list span{color:#64efff;font:13px Georgia,serif}.dot{width:6px;height:6px;border-radius:50%;background:#596182}.dot.done{background:#65efae;box-shadow:0 0 8px #65efae}.content{padding:44px clamp(20px,4vw,65px) 70px}.header{max-width:1780px;margin:0 auto 30px;display:flex;justify-content:space-between;gap:18px;align-items:end}.eyebrow{margin:0;color:#65efff;font-size:11px;letter-spacing:.14em;font-weight:800}.header h1{margin:8px 0 0;font-size:clamp(28px,3.8vw,48px);letter-spacing:-.055em;line-height:1.05}.export{padding:12px 16px;border:1px solid #65efff;background:linear-gradient(135deg,#26347c,#075e7e);border-radius:4px;color:white;font-weight:700;cursor:pointer}.grid{max-width:1780px;margin:auto;display:grid;grid-template-columns:minmax(320px,1.15fr) minmax(290px,.85fr) minmax(320px,.9fr);gap:16px}.card{min-width:0;padding:22px;border:1px solid #303a68;background:linear-gradient(155deg,#1b2040,#0b0e1d);box-shadow:0 15px 50px #0004}.label{color:#66efff;font-size:11px;letter-spacing:.14em;font-weight:800}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}.images a{display:block;background:#05060b;border:1px solid #323a62}.images img{display:block;width:100%;max-height:760px;object-fit:contain}.hint{color:#95a0c4;font-size:12px;line-height:1.6}.read{margin:25px 0;color:#f4f6ff;font-size:18px;line-height:1.7}.uncertain{padding:14px;border-left:2px solid #f0bb63;background:#3d2e191f;color:#dfc899;font-size:14px;line-height:1.65}.uncertain b{color:#f6c66e;font-size:12px;letter-spacing:.08em}.status{display:grid;gap:8px;margin-top:24px;color:#aab5d8;font-size:12px;font-weight:700}.status select,textarea{border:1px solid #3c4775;background:#080b17;color:#f7f8ff;border-radius:4px;padding:11px;font:inherit}textarea{width:100%;height:385px;margin-top:24px;font-size:15px;line-height:1.65;resize:vertical}.confirmed{margin:13px 0 0;color:#aab5d8;font-size:12px}.footnote{margin-top:16px;color:#9ba6cc;font-size:12px}@media(max-width:1220px){.grid{grid-template-columns:1fr 1fr}.source{grid-row:span 2}.confirm{grid-column:2}}@media(max-width:820px){.app{display:block}.side{position:relative;height:auto}.list{max-height:240px;overflow:auto}.content{padding:28px 16px}.header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.source,.confirm{grid-row:auto;grid-column:auto}}
  </style>
</head>
<body>
<main class="app"><aside class="side"><div class="brand"><b>SI</b>手写批注核验台</div><p>逐页比对原图、识别结果与正式确认内容。输入仅保存于本机浏览器，可导出为 Markdown。</p><input id="search" placeholder="搜索标题或内容" /><div id="list" class="list"></div><p class="footnote">已确认：<strong id="progress">0 / 23</strong></p></aside>
<section class="content"><header class="header"><div><p class="eyebrow">MouSuanAI · MANUAL AUDIT</p><h1>手写批注核验台</h1></div><button class="export" id="export">导出核验记录 ↗</button></header><div class="grid"><article class="card source"><div class="label" id="sourceLabel">原始图像</div><div class="images" id="images"></div><p class="hint">点击图片可放大查看原图。</p></article><article class="card"><div class="label">我的识别</div><p class="read" id="read"></p><div class="uncertain"><b>待您核验</b><div id="uncertain"></div></div><label class="status">处理状态<select id="status"><option>待核验</option><option>已确认</option><option>暂不采用</option></select></label></article><article class="card confirm"><div class="label">您确认的正式内容</div><textarea id="confirm" placeholder="请在这里输入确认后的中文／英文正式表述……"></textarea><p class="confirmed">输入会自动保存在这台设备。完成后使用右上角导出。</p></article></div></section></main>
<script>
const I=id=>id.includes('.')?'../../public/audit/handwritten/'+id:'../../public/audit/handwritten/codex-clipboard-'+id+'.jpg';
const items=[
['结构信息、信息与计算智能的通道',['39b0d331-ffa0-4e78-9da4-5bd663f32a38'],'可辨认：批注讨论结构与信息的关系；结论句为“打通了信息与计算智能的通道。”','第一句中间有涂改，无法可靠逐字还原。请确认完整原文。'],
['信息世界与层谱抽象',['d75d5167-957c-4e5f-bb9d-ddf42174058c'],'可辨认：信息世界的层谱抽象……信息基本定理。','“层谱抽象”后的关键词不清晰；请写下正式句子。'],
['层谱抽象与“智”',['5bd61271-06b5-43b8-b6cd-46ac7ec6d1c7'],'可辨认：层谱抽象是信息世界研究中的重要概念；批注追问“智”与层谱抽象的关系。','请确认两条批注的完整定义性句子。'],
['结构熵学的基础性定位',['5c0a7e2e-6a70-493c-b281-9ea1d1b3f509'],'可辨认：结构熵学应定位为理解复杂系统、研究智能的基础理论。','整段字迹较密，无法可靠逐字转写；请补充电子文本或正式表述。'],
['层谱抽象的总方法',['d6a313e9-60eb-415d-a4d4-4a8390f128b8'],'可辨认：“层谱抽象是人怎么认识世界的总方法。”“层谱抽象的数学定义是什么？”','第三句关于层谱抽象、世界和数学/智能的关系不清晰。'],
['首页中文：谋算智能与英文术语',['6913dd9b-bbee-4d43-a548-87f3cd441e30','ae39483c-9196-4ce2-a8ea-37d6de207551'],'批注质疑把中文“智能”直接译为 Intelligence；“Science and Technology of MouSuan Strategy”也需重新核对。','请确认最终统一的中英名称及缩写。'],
['首页中文宣言：信息、智、能',['29c693d6-b23f-4dfe-bb08-2990bdaa582d','bd7b0828-1ac5-4506-a9a5-cf403a91ed08'],'批注要求重核“生成”、信息与不确定性的关系，以及“智”为策略性设计、“能”为高效行动。','请确认“信息是消除/减少不确定性”的最终句式，以及是否保留“智能=信息”。'],
['首页英文宣言：Zhi–Neng',['e1412c55-a9d2-462f-8a61-3c21d5c8ece4'],'批注指向 generated 一词及英文 Zhi / Neng 定义，要求使用术语表的正式表达。','请确认 generated、generation、created/established 的最终术语。'],
['第一板块中文：三张核心卡',['9b10eaf5-9569-4a89-a9ab-85c53915875f','bd5277ad-7bba-4c54-9bf1-1dd487603c9c','b717a22f-1739-4f79-b3a9-96b9ebc48e9c'],'三张核心卡旁标有“加 3(3)–3(7)”，要求将前置理论批注补入对应内容。','需确认 3(3)–3(7) 与每一张卡片的确切映射。'],
['第一板块英文：层谱抽象与谋算博弈',['6e934a4f-6440-427c-bfaf-391f648af9fd','264e177b-7000-4ed9-bf5b-df70eb823781'],'批注要求说明层谱抽象是信息世界的总体策略／总方法；补足数学原理，并加入 MouSuan game。','请确认 MouSuan game 的正式定义与放置位置。'],
['第二板块中文应用',['0fe03000-a00e-46c5-b3ff-a446354c3e6c'],'批注要求澄清具身智能与自我意识的关系；其他卡片应使用结构信息和层谱抽象的准确表达。','“具身智能”的具体改写句子尚未完全辨认。'],
['第二板块英文应用',['39d7dbe2-92f0-4cd0-924c-e00783dbcbaa'],'MouSuan learning 应强调 information principles；结构化决策应表达 hierarchically abstracting；Structured AI 末尾需核对 action / acting。','请确认各英文卡片的完整正式句子。'],
['第三板块中文：物理世界、信息世界与孙子兵法',['d34f5509-7684-453d-8ff5-c415251b7ec3','0ebf796d-9434-4b80-be96-28a291641049'],'批注要求强化战争作为物质与信息结合的动态体系对抗；书卡更大，并增加创建智能机的解释。','新增段落的完整中文原文待确认。'],
['第三板块中文：孙子五大定律',['c218e180-ddf4-49d2-9faf-4782ebde5fed','cff0fbe8-967f-4336-b28e-822ece1008e8'],'应明确体系对抗、物质与信息、战争过程的基本规律，以及“知彼、知己、知天、知地”如何构成获利/胜利条件。','第 1、3、5 条精确替换句暂不清晰。'],
['第三板块英文：Sun Tzu model',['6e9650ce-8a43-41b9-9a01-467b3e8023cf','f2b3c7fd-3beb-413b-a312-0d1c894391f3'],'将 five laws 改为更准确的 principles；第 5 条由 victory 改为 winning and gaining；模型应说明物质与信息、多主体／多系统对抗。','MouSuan Strategy / Intelligence 与书卡正文最终英文仍待确认。'],
['关于我们中文',['cf6403c9-9363-4804-82a1-47969d6d6b47'],'批注指向标题和导语：团队定位、信息的数学原理、人工智能科学技术路线应以正式术语重新表达。','红字中关于团队定位的整句需要确认。'],
['About us English',['1cc44bf8-6a88-4ab6-8841-0b3cab21bbe0','c53d0cb0-f056-4325-99c8-f9ca4bbab76b'],'需区分 information-world mathematics、intelligence science 和 computational intelligence；补入 learning machine from observing。','请确认团队英文定位最终正式名称。'],
['两大重大计划',['8c807093-28ef-45b6-bb8a-7c2f737c6aca','b30cb00f-76b0-49fc-9f17-c14b63a63ba9'],'两张计划卡被标注：MouSuan 英文和 strategic design 用法需统一；孙子模型性质应与正式定义一致。','请确认卡片标题的最终英译。'],
['核心成员与成果库',['f9a15322-76f7-4ead-9c02-ce65b2e4336e'],'批注提出建立“Significant Results Library of Principled Machine Intelligence”，并使成员成果与资源库关联。','请确认资源库最终中英文名称和缩写。'],
['第四板块：知识库',['fb1a0320-4cb8-423b-8fe2-b7856b7a92a6','39bb3ace-b157-46e9-80f4-7b80a7b653f8'],'要求将所有相关成果系统收录，按主题分类；资源库应作为有原理的智能机成果库，而非零散外链。','请确认必须覆盖的一级分类。'],
['页脚与移动端',['39bb3ace-b157-46e9-80f4-7b80a7b653f8','fb1a0320-4cb8-423b-8fe2-b7856b7a92a6'],'页脚中的研究库名、术语 Wiki、联系邮箱在移动端发生竖排与挤压，需要响应式重排。','无。']
,
['补充理论批注：对象的层谱抽象与信息世界',['codex-clipboard-939f0830-692b-47ce-81ad-62ca8d8a096a.png','codex-clipboard-67bad121-41a0-49d0-a706-6e02c5f467fb.jpg'],'补充页讨论一个对象的层谱抽象、对象的结构世界，以及物质世界、信息世界与数学对象之间的关系。页面提出多个定义性问题，要求分别澄清各对象所在的抽象层谱。','红字逐句较密，尚不能可靠还原。请确认：对象层谱抽象的正式定义，以及物质世界、信息世界和数学对象的关系。'],
['补充理论批注：信息世界对象、数学对象与层谱抽象',['codex-clipboard-76fdd83d-7376-4322-a577-544ef41ceae4.jpg','codex-clipboard-1fd3723d-3072-4319-affe-0b3e8b77aaef.jpg','codex-clipboard-fdc99341-e445-41ce-a0b7-70f1675e5e18.jpg'],'补充页围绕信息世界的对象、信息系统、数学对象和层谱抽象提出问题；其中要求区分信息世界与物理世界，并核验数学在信息世界中的位置。','请逐项确认：1）数学是否是信息世界的对象；2）层谱抽象策略所研究的对象；3）人工智能与信息世界的关系；4）信息世界的层谱抽象的正式表述。']
].map((x,i)=>({id:'item-'+i,n:i+1,title:x[0],images:x[1],read:x[2],uncertain:x[3]}));
const key='mousuan-manual-audit-v1',saved=JSON.parse(localStorage.getItem(key)||'{}');let active=0,state=saved.state||{},confirmed=saved.confirmed||{};
const $=s=>document.querySelector(s),list=$('#list'),read=$('#read'),uncertain=$('#uncertain'),images=$('#images'),status=$('#status'),confirm=$('#confirm'),progress=$('#progress');
function save(){localStorage.setItem(key,JSON.stringify({state,confirmed}))}function render(){const x=items[active];$('#sourceLabel').textContent='原始图像 · '+x.images.length+' 张';read.textContent=x.read;uncertain.textContent=x.uncertain;images.innerHTML=x.images.map(src=>'<a target="_blank" href="'+I(src)+'"><img src="'+I(src)+'" alt="'+x.title+' 原始批注图"></a>').join('');status.value=state[x.id]||'待核验';confirm.value=confirmed[x.id]||'';list.innerHTML=items.filter(x=>(x.title+x.read).toLowerCase().includes($('#search').value.toLowerCase())).map(x=>'<button class="'+(x.n-1===active?'on':'')+'" data-id="'+(x.n-1)+'"><span>'+String(x.n).padStart(2,'0')+'</span><b>'+x.title+'</b><i class="dot '+(state[x.id]==='已确认'?'done':'')+'"></i></button>').join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=+b.dataset.id;render()});progress.textContent=Object.values(state).filter(x=>x==='已确认').length+' / '+items.length}
status.onchange=()=>{state[items[active].id]=status.value;save();render()};confirm.oninput=()=>{confirmed[items[active].id]=confirm.value;save()};$('#search').oninput=render;$('#export').onclick=()=>{const text=items.map(x=>'## '+x.n+'. '+x.title+'\n\n状态：'+(state[x.id]||'待核验')+'\n\n识别：'+x.read+'\n\n待确认：'+x.uncertain+'\n\n确认内容：\n'+(confirmed[x.id]||'（未填写）')).join('\n\n---\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download='mousuan-manual-audit.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),200)};render();
</script></body></html>
