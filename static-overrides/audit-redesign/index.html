<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新版层谱抽象审阅</title>
  <link rel="icon" type="image/svg+xml" href="./encoding-tree.svg">
  <style>
    :root{color-scheme:dark;--bg:#050a17;--panel:#0d1730;--panel2:#121f3e;--line:#27375c;--text:#eef4ff;--muted:#aebbd3;--cyan:#55e6ff;--violet:#9d91ff}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 80% 0,#172455 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
    button,textarea{font:inherit}.shell{max-width:1800px;margin:auto;padding:28px}.top{display:flex;gap:22px;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:46px;height:46px}.eyebrow{font-size:13px;letter-spacing:.16em;color:var(--cyan);font-weight:800}.top h1{font-size:clamp(25px,3vw,43px);margin:3px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#111d38;color:var(--text);padding:11px 15px;border-radius:11px;cursor:pointer}.btn:hover{border-color:var(--cyan)}.btn.primary{background:linear-gradient(120deg,#4b3e9e,#166997);border-color:#768fff}
    .tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 15px;scrollbar-color:#4c5c82 transparent}.tab{white-space:nowrap;border:1px solid var(--line);background:#0b152b;color:var(--muted);padding:9px 13px;border-radius:999px;cursor:pointer}.tab.active{background:#263c70;color:#fff;border-color:var(--cyan)}
    .meta{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:12px 0}.meta h2{font-size:clamp(22px,2.2vw,34px);margin:0}.badge{border:1px solid #806fe6;color:#c7bfff;padding:6px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
    .grid{display:grid;grid-template-columns:minmax(360px,1.1fr) minmax(320px,.9fr) minmax(320px,.9fr);gap:18px;align-items:stretch}.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:620px}.card-head{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:800;color:var(--cyan);letter-spacing:.04em}.photo{display:flex;align-items:flex-start;justify-content:center;background:#020713;padding:12px;height:calc(100% - 52px)}.photo img{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain;border-radius:8px}.recognition{padding:22px;font-size:17px;line-height:1.85;white-space:pre-wrap;color:#e1e8f7}.recognition strong{color:#fff}.editor{height:calc(100% - 52px);display:flex;flex-direction:column;padding:16px}.editor textarea{width:100%;flex:1;min-height:500px;resize:vertical;background:#060d1e;color:#f1f5ff;border:1px solid #33466f;border-radius:12px;padding:17px;line-height:1.75;outline:none}.editor textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #55e6ff1c}.saved{color:#89d6b3;font-size:13px;margin-top:10px;min-height:20px}
    .nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.nav button{min-width:130px}.hint{margin:18px 0 0;color:var(--muted);font-size:14px}
    @media(max-width:1100px){.grid{grid-template-columns:1fr}.card{min-height:auto}.photo img{max-height:none}.recognition{min-height:300px}.editor textarea{min-height:380px}.top{align-items:flex-start;flex-direction:column}}
    @media(max-width:600px){.shell{padding:18px 12px}.actions{width:100%}.actions .btn{flex:1}.meta{align-items:flex-start;flex-direction:column}.nav button{min-width:0;flex:1}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand"><img src="./encoding-tree.svg" alt="编码树"><div><div class="eyebrow">ENCODING TREE · 层谱抽象审阅</div><h1>新版手写设计逐页核验</h1></div></div>
    <div class="actions"><button class="btn" id="reset">清空本页确认</button><button class="btn primary" id="export">导出全部 Markdown</button></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="审阅页签"></nav>
  <section class="meta"><h2 id="title"></h2><span class="badge">初步识别 · 待核验</span></section>
  <section class="grid">
    <article class="card"><div class="card-head">原始照片</div><div class="photo"><img id="photo" alt="手写审阅页"></div></article>
    <article class="card"><div class="card-head">初步识别</div><div class="recognition" id="recognized"></div></article>
    <article class="card"><div class="card-head">您的确认内容（自动保存）</div><div class="editor"><textarea id="confirmed" placeholder="请在这里修改或确认识别内容……"></textarea><div class="saved" id="saved"></div></div></article>
  </section>
  <div class="nav"><button class="btn" id="prev">← 上一页</button><button class="btn" id="next">下一页 →</button></div>
  <p class="hint">每个页签对应一张独立照片。确认内容只保存在当前浏览器；完成后请点击“导出全部 Markdown”。</p>
</main>
<script>
const pages=[
{id:'summary',label:'总纲',title:'总纲 · 现实世界完整建模',img:'summary.jpg',text:`核心结构：\n\n1. 现实世界完整建模\n2. 信息世界\n3. 机器智能体系\n\n总体要求：按层谱抽象组织网站；首页清楚、清晰、简单；内容分多层，点击进入；主要观点标注引文。`},
{id:'01',label:'01',title:'现实世界的完整建模',img:'page-01.jpg',text:`现实世界的完整建模\n\n• 物理世界\n• 信息世界\n\n初步理解：现实世界由物理世界与信息世界共同构成。`},
{id:'02',label:'02',title:'物理世界',img:'page-02.jpg',text:`一个对象的物理性质由该对象本身完全决定。\n例如：人的身高、体重和年龄。\n\n现实世界对象的物理性质构成物理世界。\n物理世界的数学方法：分而治之分析方法。\n物理世界的数学：研究物质的数学。\n物理世界的基本数学原理：微积分。\n微积分支撑物理世界科学技术。`},
{id:'03',label:'03',title:'信息世界',img:'page-03.jpg',text:`一个对象的信息性质，是该对象的存在性、作用、运动性。\n一个自我意识主体的信息性质还包括需求和愿望。\n\n现实世界对象的信息性质构成信息世界。\n例如：人的学历、经历、工作、贡献、影响是信息性质；国家的存在性、作用、运动性、需求和愿望是国家的信息性质；智能体也有自己的信息性质。`},
{id:'04',label:'04',title:'两个世界的认识',img:'page-04.jpg',text:`现实世界的每一个对象都有物理性质和信息性质，二者结合起来构成该对象的完整知识。\n\n物理世界和信息世界构成现实世界的两个科学技术空间。`},
{id:'05',label:'05',title:'信息世界的信息传递过程',img:'page-05.jpg',text:`一个对象的信息性质嵌入在该对象和其他对象的关系结构中。\n\n对于对象 X，其信息性质不能通过对 X 的分而治之而获得。一个对象的信息性质需要嵌入在对象之间的关系中，并随关系的运动和变化形成、更新。`},
{id:'06',label:'06',title:'信息世界的基本过程',img:'page-06.jpg',text:`一个对象的信息性质嵌入在包括该对象及其他对象的信息系统中。\n\n对信息系统使用分而治之会破坏系统关系；需要层谱抽象，在不同抽象层之间演算与推理。`},
{id:'07',label:'07',title:'现实世界的完备知识',img:'page-07.jpg',text:`对象 X 的完备知识由两部分共同构成：\n\n物理性质：定义；分而治之与计算；数学原理是微积分。\n信息性质：存在性、作用、运动性、需求、愿望；方法是层谱抽象；数学原理是信息的数学原理。`},
{id:'08',label:'08',title:'数学中的一个定理（Shannon 1948）',img:'page-08.jpg',text:`Shannon 于 1948 年度量随机变量中不确定性的量，奠定了信息论的基础。\n\n信息量或熵只是信息的一种表示或一个部分。问题是：怎样定义完整的信息，以及怎样度量信息？`},
{id:'09',label:'09',title:'信息概念与结构信息理论',img:'page-09.jpg',text:`一个理论概念“信息”的数学理论是什么？\n\n结构信息理论（2016）试图回答上述问题。`},
{id:'10',label:'10',title:'信息世界的公理化数学原理',img:'page-10.jpg',text:`牛顿于 1686 年建立物理世界分析的数学原理——微积分，引领近代科技革命。\n\n信息世界同样需要公理化数学原理，也需要独立的科学技术体系。`},
{id:'11',label:'11',title:'智能科学技术三大问题',img:'page-11.jpg',text:`1. 智能的数学实质是什么？智能的本原要素是什么？\n2. 智能的有利／有害策略是什么？智能从哪里来？\n3. 怎样实现智能？智能的模型是什么？`},
{id:'12',label:'12',title:'信息世界科学体系下的机器智能体系',img:'page-12.jpg',text:`数学基础：信息的数学原理。\n智能策略：谋、算。\n智能模型：机器智能模型。\n\n理论原则涉及学习、组织、自我意识、博弈／决策、行动与验证。`},
{id:'13',label:'13',title:'智能的数学实质',img:'page-13.jpg',text:`智能问题：智能 = 信息。\n\n一个自我意识主体的智能就是它的信息。\n智能的本原要素是信息。\n信息是打开机器智能科学技术体系的钥匙。`},
{id:'14',label:'14',title:'智能的策略原理',img:'page-14.jpg',text:`智能的策略原理：\n\n• 谋：层谱抽象、全局认知。\n• 算：分而治之、局部逻辑推理。\n\n智能策略 = 谋算。这里回答“智能从哪里来”的问题。`},
{id:'15',label:'15',title:'从策略原理到双脑体系结构',img:'page-15.jpg',text:`把“谋”与“算”两种智能策略映射到机器体系结构：\n\n谋脑与算脑（左右半脑）协同，形成谋算双脑体系结构。`},
{id:'16',label:'16',title:'机器智能模型',img:'page-16.jpg',text:`机器智能模型：\n\n理论层：学习、组织、自我意识、策略设计。\n工程层：决策、行动、验证。\n\n通过层级组织把理论原则落实为机器体系。`},
{id:'17',label:'17',title:'机器智能模型与重大问题',img:'page-17.jpg',text:`机器智能研究继续回答：\n\n• 智能从何而来？\n• 怎样实现智能？\n• 智能的模型是什么？\n\n为后续科学研究和实际落地形成清晰的层谱结构。`}
];
let index=0;const $=s=>document.querySelector(s),tabs=$('#tabs'),photo=$('#photo'),title=$('#title'),recognized=$('#recognized'),confirmed=$('#confirmed'),saved=$('#saved');
function key(p){return 'mousuan.audit.redesign.v1.'+p.id}
function render(){const p=pages[index];title.textContent=`${p.label} · ${p.title}`;photo.src='./images/'+p.img;photo.alt=p.title;recognized.textContent=p.text;confirmed.value=localStorage.getItem(key(p))??p.text;saved.textContent='';[...tabs.children].forEach((b,i)=>b.classList.toggle('active',i===index));$('#prev').disabled=index===0;$('#next').disabled=index===pages.length-1;tabs.children[index]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
pages.forEach((p,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=`${p.label} ${p.title}`;b.onclick=()=>{index=i;render()};tabs.appendChild(b)});
let timer;confirmed.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{localStorage.setItem(key(pages[index]),confirmed.value);saved.textContent='已自动保存';setTimeout(()=>saved.textContent='',1500)},250)});
$('#prev').onclick=()=>{if(index>0){index--;render()}};$('#next').onclick=()=>{if(index<pages.length-1){index++;render()}};
$('#reset').onclick=()=>{localStorage.removeItem(key(pages[index]));confirmed.value=pages[index].text;saved.textContent='本页已恢复为初步识别'};
$('#export').onclick=()=>{const body=pages.map(p=>`## ${p.label} · ${p.title}\n\n${localStorage.getItem(key(p))??p.text}`).join('\n\n---\n\n');const blob=new Blob([`# 新版层谱抽象手写审阅结果\n\n${body}\n`],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mousuan-redesign-audit.md';a.click();URL.revokeObjectURL(a.href)};
render();
</script>
</body>
</html>
