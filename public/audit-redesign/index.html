<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>第二轮手稿审阅 · 新版分层结构</title>
  <meta name="description" content="谋算网站新版分层结构手稿逐页核验">
  <style>
    :root{--bg:#07101f;--panel:#101c31;--panel2:#14243d;--line:#2c4161;--text:#eef5ff;--muted:#9fb0c9;--cyan:#61e6ff;--violet:#a99cff;--ok:#83edb7;--warn:#ffd781}
    *{box-sizing:border-box}html{color-scheme:dark;background:var(--bg)}body{margin:0;background:radial-gradient(circle at 85% 0,#172c50 0,transparent 38%),var(--bg);color:var(--text);font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}
    button,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1680px;margin:auto;padding:28px clamp(18px,3vw,54px) 54px}
    header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.title{font-size:clamp(30px,4vw,64px);line-height:1.03;margin:8px 0 12px;letter-spacing:-.035em}.lede{max-width:860px;color:var(--muted);font-size:17px}.notice{max-width:360px;border:1px solid #415a81;background:#12233d;padding:15px 17px;color:#d8e7ff}.notice strong{color:var(--warn)}
    .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-color:#456080 transparent}.tab{flex:0 0 auto;border:1px solid var(--line);background:#0d192c;color:var(--muted);padding:10px 15px;border-radius:999px;font-weight:750}.tab.active{background:linear-gradient(120deg,#25348b,#155d8d);border-color:#76cfff;color:#fff;box-shadow:0 0 24px #245ac355}
    .workspace{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(390px,.75fr);gap:20px;align-items:start}.card{border:1px solid var(--line);background:linear-gradient(145deg,#101d32,#0b1526);box-shadow:0 18px 56px #0005}.image-card{padding:14px;position:sticky;top:14px}.image-wrap{height:calc(100vh - 184px);min-height:540px;display:grid;place-items:center;background:#050b14;overflow:hidden}.image-wrap img{width:100%;height:100%;object-fit:contain;display:block}.image-link{display:block;color:inherit;text-decoration:none}.image-meta{display:flex;justify-content:space-between;gap:15px;padding:13px 4px 0;color:var(--muted);font-size:14px}
    .review{padding:24px}.page-tag{color:var(--cyan);font-weight:850;letter-spacing:.12em}.review h2{font-size:clamp(25px,3vw,43px);line-height:1.08;margin:8px 0 18px}.field{margin:18px 0}.field label{display:block;font-weight:800;color:#d9e6fa;margin-bottom:8px}.field small{display:block;color:var(--muted);margin-top:7px}.transcript{white-space:pre-wrap;background:#0a1424;border-left:3px solid var(--cyan);padding:16px 18px;color:#d9e8fb;min-height:170px}.interpretation{margin:0;border-left:3px solid var(--violet);background:#111a35;padding:14px 18px;color:#d9d6ff}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}select,textarea{width:100%;border:1px solid #3b5276;background:#081321;color:#eff7ff;padding:12px;border-radius:6px}textarea{min-height:220px;resize:vertical}.save-state{color:var(--ok);min-height:25px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.action{border:1px solid #4b6489;background:#13243c;color:#eaf4ff;padding:10px 14px;border-radius:5px;font-weight:750}.action.primary{background:linear-gradient(120deg,#34358e,#1473a0);border-color:#69d7ff}.action:disabled{opacity:.35;cursor:not-allowed}
    .overview-list{margin:0;padding-left:22px;color:#dbe8f8}.overview-list li{margin:7px 0}.progress{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted)}
    @media(max-width:980px){header{display:block}.notice{max-width:none;margin-top:18px}.workspace{grid-template-columns:1fr}.image-card{position:static}.image-wrap{height:min(68vh,760px);min-height:380px}}
    @media(max-width:600px){.shell{padding:18px 12px 38px}.title{font-size:34px}.review{padding:18px}.controls{grid-template-columns:1fr}.image-wrap{height:55vh;min-height:330px}.image-meta{display:block}.image-meta span{display:block;margin-top:4px}}
  </style>
</head>
<body>
<main class="shell">
  <header>
    <div>
      <div class="eyebrow">Manual audit · Round 2</div>
      <h1 class="title">新版分层结构手稿审阅</h1>
      <p class="lede">按手稿页码逐页核验。每个标签只展示一张原图；初步识别、暂定结构解读、核验状态和人工确认稿分别保存。未经确认的文字不会作为正式网站文案使用。</p>
    </div>
    <div class="notice"><strong>仅供核验</strong><br>本页内容尚未应用到正式首页。确认后再依照“层谱抽象、简单、多层、逐层进入”的原则重构。</div>
  </header>
  <nav class="tabs" id="tabs" aria-label="手稿页标签"></nav>
  <section class="workspace">
    <article class="card image-card">
      <a class="image-link" id="imageLink" target="_blank" rel="noopener"><div class="image-wrap"><img id="pageImage" alt="手稿原图"></div></a>
      <div class="image-meta"><span id="imageName"></span><span>点击原图可单独放大</span></div>
    </article>
    <article class="card review">
      <div class="page-tag" id="pageTag"></div>
      <h2 id="pageTitle"></h2>
      <div class="field"><label>当前识别稿</label><div class="transcript" id="transcript"></div><small>“待核验”表示字迹或语义尚不能可靠确定。</small></div>
      <div class="field"><label>暂定结构解读</label><p class="interpretation" id="interpretation"></p><small>这是该页在未来网站架构中的暂定位置，不是手稿的逐字转写；以您的人工确认稿为准。</small></div>
      <div class="controls">
        <div class="field"><label for="status">核验状态</label><select id="status"><option>待核验</option><option>已确认</option><option>需重识别</option></select></div>
        <div class="field"><label for="confidence">识别置信度</label><select id="confidence"><option>低</option><option>中</option><option>高</option></select></div>
      </div>
      <div class="field"><label for="confirmed">人工确认内容</label><textarea id="confirmed" placeholder="请在这里输入最终确认文字；内容会自动保存在本机浏览器。"></textarea></div>
      <div class="save-state" id="saveState" aria-live="polite"></div>
      <div class="actions"><button class="action" id="prev">← 上一页</button><button class="action primary" id="save">保存本页</button><button class="action" id="next">下一页 →</button><button class="action" id="export">导出 Markdown</button></div>
      <div class="progress" id="progress"></div>
    </article>
  </section>
</main>
<script>
const pages=[
 {id:'overview',tab:'总览',title:'新版网站结构总览',img:'images/overview.jpg',confidence:'高',text:`首页按层谱抽象组织：清楚、清晰、简单、多层；分成若干层，可以逐层点击进入。主要观点的引文应注明来源。\n\n三个总层次：\n• 现实世界完整建模\n• 信息世界\n• 机器智能体系`},
 {id:'01',tab:'01',title:'现实世界的完整建模',img:'images/page-01.jpg',confidence:'高',text:`现实世界的完整建模\n\n• 物理世界\n• 信息世界`},
 {id:'02',tab:'02',title:'物理世界',img:'images/page-02.jpg',confidence:'中',text:`一个对象的物理性质由该对象本身完全决定。例如一个人的身高、体重和色彩。现实世界对象的物理性质构成的空间是物理世界。\n\n物理世界的认识方法：分而治之分析方法。\n物理世界的数学原理：微积分。\n\n（个别字迹待核验）`},
 {id:'03',tab:'03',title:'信息世界',img:'images/page-03.jpg',confidence:'中',text:`一个对象的存在性是该对象的本体性、作用、运动性。一个自我意识主体的信息性质，是该自我意识主体的存在性、作用、运动性、需求和愿望。现实世界对象的信息性质构成现实世界的认识空间，称为信息世界。\n\n例如：一个人的学历、经历、工作、贡献、影响是他的信息性质；一个国家的重要影响，由它的信息性质定义；国家必须有需求和愿望。一个组织体的信息性质有意义。\n\n（后半段部分待核验）`},
 {id:'04',tab:'04',title:'两个世界的认识',img:'images/page-04.jpg',confidence:'中',text:`现实世界的每一个对象，有一个物理性质和一个信息性质，综合起来构成这个对象的完整知识。\n\n物理世界和信息世界构成了现实世界的两个科学技术空间。\n\n（个别字待核验）`},
 {id:'05',tab:'05',title:'信息世界的完整认识 / 完整建模',img:'images/page-05.jpg',confidence:'低',text:`一个对象的信息性质嵌入在该对象和其他对象关系构成的系统中。\n\n一个对象，例如 X 的信息性质，不能仅通过对 X 的分而治之而获得。一个对象的信息性质嵌入在它与其他对象相互作用的系统中；认识该对象需要把它放进该系统中。\n\n（标题及多处字迹待核验）`},
 {id:'06',tab:'06',title:'信息世界的基本定律',img:'images/page-06.jpg',confidence:'低',text:`• 一个对象的信息性质嵌入在该对象及与该对象有联系的信息系统中。\n\n• 物理世界的分而治之分析方法适用于信息系统，但不能在同一抽象层谱上直接复用。\n\n• 信息世界的总方法是层谱抽象。\n\n（第二、三条需核验）`},
 {id:'07',tab:'07',title:'现实世界的完备知识',img:'images/page-07.jpg',confidence:'中',text:`对象 X 的物理性质：\n• 由 X 定义\n• 方法：分而治之、计算\n• 数学原理：微积分\n\n对象 X 的信息性质：\n• 存在性\n• 作用\n• 运动性\n• 需求\n• 愿望\n• 方法：层谱抽象 / 体系\n• 数学原理：信息的数学原理\n\n一个对象的物理性质和信息性质合起来构成该对象的完备知识。\n\n（右侧方法字迹待核验）`},
 {id:'08',tab:'08',title:'科学中的一个定律',img:'images/page-08.jpg',confidence:'低',text:`Shannon 1948 年度量了嵌入在一个随机变量中的不确定性的量，度量了通过一个信道传输、由收方消除的发送方……\n\n由于不确定性的量并不等于信息的概念，因此 Shannon 本人反对后人的“信息”解释。一个通信概念如何等于一个信道传输？现有的信息论没有回答基本问题。\n\n（多处待核验）`},
 {id:'09',tab:'09',title:'信息的数学模型问题',img:'images/page-09.jpg',confidence:'高',text:`一个科学概念的“信息”的数学模型是什么？\n\n结构信息理论 2016 年论文回答了以上问题。`},
 {id:'10',tab:'10',title:'信息世界的公理化数学原理',img:'images/page-10.jpg',confidence:'低',text:`牛顿 1686 年提出物质运动的三大定律，创建物理世界分析的数学原理——微积分，从而引发工业革命。\n\n信息世界的公理化数学原理同样需要一套体系，以信息的层谱度量、信息解码和信息生成为核心。\n\n（后半段待核验）`},
 {id:'11',tab:'11',title:'智能科学技术三大问题',img:'images/page-11.jpg',confidence:'中',text:`• 智能的数学实质是什么？即智能的本质要素是什么？\n\n• 智能的方法或策略是什么？智能从哪里来？\n\n• 怎样实现智能？智能的模型是什么？`},
 {id:'12',tab:'12',title:'信息世界科学体系下的机器智能体系',img:'images/page-12.jpg',confidence:'中',text:`• 数学基础：信息的数学原理，见《人工智能科学》\n\n• 智能策略：谋、算\n\n• 智能模型\n  - 学习原理：学习、解码知识、博弈（待核验）\n  - 工程原理：决策、行动、验证（待核验）`},
 {id:'13',tab:'13',title:'智能的数学实质',img:'images/page-13.jpg',confidence:'高',text:`智能问题：智能 = 信息。\n\n• 一个自我意识体的智能就是它的信息。\n• 智能的本质要素是信息。\n• 信息是打开智能一切本质关系的钥匙。\n\n（见《人工智能科学》和《人工智能原理》）`},
 {id:'14',tab:'14',title:'智能的策略原理',img:'images/page-14.jpg',confidence:'中',text:`智能的策略就是：\n\n• 谋，谋全局：层谱抽象、全局认知\n• 算，算局部：分而治之、逻辑推理\n\n智能策略 = 谋算。\n\n回答了智能从哪里来的问题。构建智能机的方法论：遵循谋算策略，按照某种层谱抽象结构组合。\n\n（后半段待核验，见《人工智能科学》）`},
 {id:'15',tab:'15',title:'智能的工程原理',img:'images/page-15.jpg',confidence:'低',text:`把智能的策略原理转化为设计规则和工程体系，进而构建智能机和智能机器人。\n\n核心问题是谋算双脑（左右半脑）协同的体系结构原理。\n\n（标题及整页多处字迹待核验）`},
 {id:'16',tab:'16',title:'机器智能模型',img:'images/page-16.jpg',confidence:'中',text:`1. 学习原理\n• 学习：认知世界、改造世界——知彼\n• 自我意识：认知自身、改造自身——知己\n• 博弈设计：设计策略，对自己有利、对他人有害（措辞待核验）\n（见《人工智能科学》）\n\n2. 工程原理（体系结构）\n• 决策\n• 行动\n• 验证：判断胜负、成败、利害（待核验）`},
 {id:'17',tab:'17',title:'机器智能模型补充',img:'images/page-17.jpg',confidence:'低',text:`手稿讨论机器智能模型、怎样实现智能，以及把相关科学问题落实到机器工程实现。\n\n原文多处无法可靠辨认，请以左侧原图为准逐句确认。`}
];
const key=id=>`mousuan-redesign-audit-v1:${id}`;let current=0;
const $=id=>document.getElementById(id);const tabs=$('tabs');
const interpretation=p=>`暂定：此页将作为“${p.title}”这一层级节点的核验依据。确认后再决定它的正式标题、层级位置、链接去向与引文；当前文字不等同于最终网站文案。`;
pages.forEach((p,i)=>{const b=document.createElement('button');b.className='tab';b.type='button';b.textContent=p.tab;b.dataset.index=i;b.onclick=()=>render(i);tabs.appendChild(b)});
function read(p){try{return JSON.parse(localStorage.getItem(key(p.id)))||{}}catch{return{}}}
function write(show=true){const p=pages[current],data={status:$('status').value,confidence:$('confidence').value,confirmed:$('confirmed').value,updated:new Date().toISOString()};localStorage.setItem(key(p.id),JSON.stringify(data));if(show){$('saveState').textContent='已保存到本机浏览器';setTimeout(()=>$('saveState').textContent='',1800)}updateProgress()}
function render(i){current=i;const p=pages[i],saved=read(p);document.querySelectorAll('.tab').forEach((el,n)=>{el.classList.toggle('active',n===i);el.setAttribute('aria-current',n===i?'page':'false')});document.querySelectorAll('.tab')[i].scrollIntoView({block:'nearest',inline:'center'});$('pageImage').src=p.img;$('pageImage').alt=`${p.tab} ${p.title} 手稿原图`;$('imageLink').href=p.img;$('imageName').textContent=`原图 · ${p.img.split('/').pop()}`;$('pageTag').textContent=p.id==='overview'?'总览':'手稿页 '+p.id;$('pageTitle').textContent=p.title;$('transcript').textContent=p.text;$('interpretation').textContent=interpretation(p);$('status').value=saved.status||'待核验';$('confidence').value=saved.confidence||p.confidence;$('confirmed').value=saved.confirmed||'';$('prev').disabled=i===0;$('next').disabled=i===pages.length-1;history.replaceState(null,'','#'+p.id);updateProgress()}
function updateProgress(){let confirmed=0;pages.forEach(p=>{if(read(p).status==='已确认')confirmed++});$('progress').textContent=`核验进度：${confirmed} / ${pages.length} 页已确认`}
$('status').onchange=()=>write(false);$('confidence').onchange=()=>write(false);let timer;$('confirmed').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>write(false),450)};$('save').onclick=()=>write(true);$('prev').onclick=()=>render(Math.max(0,current-1));$('next').onclick=()=>render(Math.min(pages.length-1,current+1));
$('export').onclick=()=>{let md='# 谋算网站第二轮结构手稿核验结果\n\n';pages.forEach(p=>{const d=read(p);md+=`## ${p.tab} ${p.title}\n\n- 状态：${d.status||'待核验'}\n- 置信度：${d.confidence||p.confidence}\n\n### 识别稿\n\n${p.text}\n\n### 人工确认\n\n${d.confirmed||'（未填写）'}\n\n`});const blob=new Blob([md],{type:'text/markdown;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mousuan-redesign-manual-audit.md';a.click();URL.revokeObjectURL(a.href)};
const initial=location.hash.slice(1);render(Math.max(0,pages.findIndex(p=>p.id===initial)));
</script>
</body>
</html>
